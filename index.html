<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table</title>
    <style>
        table
         th,
          td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
            text-align: center;
          }
          .cabecalho {
            background-color: #742525;
          }
          </style>
</head>
<body>
    <table>
        <caption>Trajetória Acadêmica e Profissional</caption>
        <tr class="cabecalho">
            <th rowspan="2" width="20%">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de Conclusão</th>
        </tr>
        <tr class="cabecalho">
            <td>Graduaçao</td>
            <td>Pós-Graduação</td>
            <td></td>
        </tr>
        <tr>
            <td>José</td>
            <td>ciencia da computação</td>
            <td>Inteligencia Artificial</td>
            <td>2023</td>
        </tr>
        <tr>
            <th>Ana</th>
            <td>Engenharia de Software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>
        <tr>
            <td>Carlos</td>
            <td>Administração</td>
            <td>Marketing</td>
            <td>2021</td>
        </tr>
        <tr>
            <td>Mariana</td>
            <td>Design Gráfico</td>
            <td>UX/UI Design</td>
            <td>2020</td>
    </table>
</body>
</html>
